services:
  mongodb:
    image: mongo:7.0
    container_name: zwiggato-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zwiggato
    volumes:
      - mongodb_data:/data/db
    networks:
      - zwiggato-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zwiggato-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/zwiggato
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      JWT_EXPIRE: 24h
      JWT_REFRESH_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/logs:/app/logs
    networks:
      - zwiggato-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zwiggato-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - zwiggato-network

volumes:
  mongodb_data:

networks:
  zwiggato-network:
    driver: bridge

