apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwiggato-backend
  namespace: zwiggato
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zwiggato-backend
  template:
    metadata:
      labels:
        app: zwiggato-backend
    spec:
      containers:
      - name: backend
        image: sumitsen2004/zwiggato-backend
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: zwiggato-config
        - secretRef:
            name: zwiggato-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zwiggato-backend-service
  namespace: zwiggato
spec:
  selector:
    app: zwiggato-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zwiggato-backend-hpa
  namespace: zwiggato
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zwiggato-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

