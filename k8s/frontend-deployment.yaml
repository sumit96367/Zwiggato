apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwiggato-frontend
  namespace: zwiggato
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zwiggato-frontend
  template:
    metadata:
      labels:
        app: zwiggato-frontend
    spec:
      containers:
      - name: frontend
        image: sumitsen2004/zwiggato-backend
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zwiggato-frontend-service
  namespace: zwiggato
spec:
  selector:
    app: zwiggato-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer

