apiVersion: v1
kind: ConfigMap
metadata:
  name: zwiggato-config
  namespace: zwiggato
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGODB_URI: "mongodb://mongodb-service:27017/zwiggato"
  JWT_EXPIRE: "24h"
  JWT_REFRESH_EXPIRE: "7d"
  FRONTEND_URL: "http://zwiggato-frontend"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"

