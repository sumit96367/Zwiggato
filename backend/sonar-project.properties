sonar.projectKey=zwiggato-backend
sonar.projectName=Zwiggato Backend
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Performance optimizations - exclude unnecessary files
sonar.exclusions=**/node_modules/**,**/coverage/**,**/logs/**,**/data/**,**/*.log,**/*.csv,**/*.json,**/*.xlsx,**/*.test.js,**/*.spec.js,**/dist/**,**/build/**

# Skip duplicate detection on large files
sonar.cpd.exclusions=**/data/**,**/logs/**,**/node_modules/**

# Language
sonar.language=js

# Test and Coverage (optional - only if tests exist)
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage report (will be ignored if file doesn't exist)
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/data/**,**/logs/**

# Code Quality
sonar.javascript.node=18

# Performance settings
sonar.scanner.skipDuplicated=true

