sonar.projectKey=zwiggato-frontend
sonar.projectName=Zwiggato Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.test.tsx,**/*.spec.js,**/*.spec.tsx

# Language
sonar.language=js

# Test and Coverage
sonar.test.inclusions=**/*.test.js,**/*.test.tsx,**/*.spec.js,**/*.spec.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.tsx,**/*.spec.js,**/*.spec.tsx,**/test/**,**/tests/**

# Code Quality
sonar.javascript.node=18

