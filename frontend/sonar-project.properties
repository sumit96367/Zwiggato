sonar.projectKey=zwiggato-frontend
sonar.projectName=Zwiggato Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Performance optimizations - exclude unnecessary files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/public/videos/**,**/public/brands/**,**/*.test.js,**/*.test.tsx,**/*.spec.js,**/*.spec.tsx,**/*.md,**/*.config.js,**/*.config.ts

# Skip duplicate detection on large/generated files
sonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/**

# Language
sonar.language=js

# Test and Coverage (optional - only if tests exist)
sonar.test.inclusions=**/*.test.js,**/*.test.tsx,**/*.spec.js,**/*.spec.tsx

# Coverage report (will be ignored if file doesn't exist)
sonar.coverage.exclusions=**/*.test.js,**/*.test.tsx,**/*.spec.js,**/*.spec.tsx,**/test/**,**/tests/**,**/public/**

# Code Quality
sonar.javascript.node=18

# Performance settings
sonar.scanner.skipDuplicated=true

