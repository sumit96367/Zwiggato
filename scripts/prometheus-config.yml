# Prometheus Configuration Template
# Location: /etc/prometheus/prometheus.yml
# Replace placeholders with actual IPs

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (Monitoring Server)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['<MONITORING_SERVER_IP>:9100']

  # Jenkins Metrics
  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['<JENKINS_SERVER_IP>:8080']

  # Kubernetes Node Exporter (after K8s setup)
  # - job_name: 'k8s'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['<K8S_NODE_IP>:9100']

